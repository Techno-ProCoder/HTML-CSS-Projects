<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;

        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: lightblue;
            height: 83px;
        }

        .container {
            background-color: green;
            margin: 12px 34px;
            padding: 55px 23px;
            /* height: 230px;
            width: 550px; */
            text-align: center;
        }

        .box1 {
            background-color: pink;
            height: 20vh;
            width: 45%;
            display: inline-block;
            margin: 0px 12px;
        }

        .box2 {
            background-color: rgb(34, 18, 181);
            margin: 0px 12px;
            height: 20vh;
            width: 45%;
            display: inline-block;
        }

        footer {
            background-color: rgb(232, 28, 28);
            height: 100px;

        }

        .text-box p {
            text-align: center;
            padding: 34px;
            border: 2px solid white;
            margin: 50px 20vw;
            /* font-size: 2em; */
            border-radius: 13px;
        }

        main {
            background-color: black;
            color: white;
            padding: 8px;
        }
        .orange-box{
            height: 32px;
            width: 32px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>
        <div class="text-box">
            <p>Welcome To Sigma Web Development Course</p>
        </div>
        <div class="orange-box"></div>
    </main>

    <footer>

    </footer>
</body>

</html>
